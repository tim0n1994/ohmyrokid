name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: World Patch logic and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run state-machine tests
        run: node tests/world.test.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          for file in lib/*.js; do
            node --check "$file"
          done
